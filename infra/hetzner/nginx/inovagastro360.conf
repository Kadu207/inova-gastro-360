# Inova Gastro 360 — Nginx (spec 013 T030)
# Copiar para /etc/nginx/sites-available/inovagastro360.conf

upstream inova_web {
  server 127.0.0.1:3102;
}

upstream inova_api {
  server 127.0.0.1:8792;
}

upstream inova_realtime {
  server 127.0.0.1:8790;
}

server {
  listen 80;
  server_name inovagastro360.inovatitech.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name inovagastro360.inovatitech.com.br;

  # certbot — spec 013 T031
  ssl_certificate     /etc/letsencrypt/live/inovagastro360.inovatitech.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/inovagastro360.inovatitech.com.br/privkey.pem;

  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://inova_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://inova_realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  location / {
    proxy_pass http://inova_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
