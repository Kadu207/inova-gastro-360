# Inova Gastro 360 — Nginx bootstrap HTTP (spec 013 T030)
# Antes do certificado TLS: só porta 80. Depois rode certbot (ver README).
# Copiar: sudo cp infra/hetzner/nginx/inovagastro360.conf /etc/nginx/sites-available/

upstream inova_web {
  server 127.0.0.1:3102;
}

upstream inova_api {
  server 127.0.0.1:8792;
}

upstream inova_realtime {
  server 127.0.0.1:8790;
}

server {
  listen 80;
  server_name inovagastro360.inovatitech.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://inova_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://inova_realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  location / {
    proxy_pass http://inova_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
