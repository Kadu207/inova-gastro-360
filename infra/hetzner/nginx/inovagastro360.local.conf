# Inova Gastro 360 — Nginx local porta 9088 (VPS compartilhada, :80 ocupada)
# systemctl nginx escuta 9088; Cloudflare Tunnel aponta para aqui.

upstream inova_web {
  server 127.0.0.1:3102;
}

upstream inova_api {
  server 127.0.0.1:8792;
}

upstream inova_realtime {
  server 127.0.0.1:8790;
}

server {
  listen 9088;
  server_name inovagastro360.inovatitech.com.br localhost;

  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://inova_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://inova_realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  location / {
    proxy_pass http://inova_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
