# Inova Gastro 360 — Nginx no Docker (porta 9088, rede inova_internal)
# Cloudflare Tunnel → http://127.0.0.1:9088

upstream inova_gastro360_web {
  server web:3102;
}

upstream inova_gastro360_api {
  server api-gateway:8792;
}

upstream inova_gastro360_realtime {
  server realtime-hub:8790;
}

server {
  listen 9088;
  server_name inovagastro360.inovatitech.com.br localhost;

  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://inova_gastro360_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://inova_gastro360_realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  location / {
    proxy_pass http://inova_gastro360_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
