# Inova Gastro 360 — Nginx no Docker (porta 9088, rede inova_internal)
# Cloudflare Tunnel → http://inova-gastro-360-nginx:9088 (cloudflared na rede inova_internal)
#
# IMPORTANTE: upstream estático cacheia IP do container web no start do nginx.
# Após restart do web, nginx aponta IP antigo → 502 Connection refused.
# Usar resolver Docker (127.0.0.11) + variável em proxy_pass força re-resolve.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 9088;
  server_name inovagastro360.inovatitech.com.br localhost;

  client_max_body_size 20m;

  # Camadas HTTP (spec 016) — Tunnel/CF já termina TLS
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP baseline compatível com Next static export + serve out
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Fotos catálogo — api-gateway lê MinIO com credenciais (objetos privados; anonymous 403).
  location /media/inova-gastro-360/ {
    set $upstream_api api-gateway:8792;
    proxy_pass http://$upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location /webhooks/ {
    set $upstream_int integrations:8791;
    proxy_pass http://$upstream_int;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  
  location /api/ {
    set $upstream_api api-gateway:8792;
    proxy_pass http://$upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    set $upstream_rt realtime-hub:8790;
    proxy_pass http://$upstream_rt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  location / {
    set $upstream_web web:3102;
    proxy_pass http://$upstream_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
