name: CI — Inova Gastro 360

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Workers dry-run
        run: |
          npm run build -w @inova-gastro-360/api-gateway
          npm run build -w @inova-gastro-360/messaging-bus
          npm run build -w @inova-gastro-360/realtime-hub
          npm run build -w @inova-gastro-360/integrations
