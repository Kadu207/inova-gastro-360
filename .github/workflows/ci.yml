name: CI — Inova Gastro 360

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

env:
  # Prisma config exige DATABASE_URL; generate não conecta ao banco real
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/inova_gastro_ci?schema=public

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: inova_gastro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Database migrate
        run: npm run db:migrate

      - name: Database seed
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Workers dry-run
        run: |
          npm run build -w @inova-gastro-360/api-gateway
          npm run build -w @inova-gastro-360/messaging-bus
          npm run build -w @inova-gastro-360/realtime-hub
          npm run build -w @inova-gastro-360/integrations
