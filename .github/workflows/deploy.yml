name: Deploy — Cloudflare Workers

# Deploy manual; CI (ci.yml) roda em todo push/PR.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de deploy
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

jobs:
  deploy-workers:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy Workers (ordem int → rt → msg → api; sem filas — ver QUEUES-DEFERRED.md)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:workers
